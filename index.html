<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
    <div class="left">
        <img class="img" src="/photos/cloth.jpg" alt="cloth">
    </div>
    <div class="form">
        <section>
            <form action="#">
            <h1 class="greeting">Hello Again!</h1>
            <p class="greeting-1">Welcome back!we missed you!</p>
            <label class="top">Email</label>
            <input class="email" type="email" placeholder="enter your email" required>
            <br>
            <label class="top-1">Password</label>
            <input class="password" type="password" placeholder="Password" required>
            <p class="recover">Forgot password</p>
            <button class="submit">Login</button>
            <P class="footer">Not a member? <a href="#" class="link" target="_blank">Register now</a></P>
            </form>
        </section>
    </div>
 </div>
</body>
</html>
